# Format, vet, test with the race detector, build the camera modules and
# check known vulnerabilities on every push to main and every pull request.
# Windows runner: the app is Windows-only (Fyne needs cgo, the panel driver
# uses the Windows HID API).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Toolchain
        run: |
          go version
          gcc --version

      - name: Format
        shell: bash
        run: |
          unformatted=$(gofmt -l internal cmd sdk modules)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build the camera modules
        run: go run ./cmd/buildmodules -o dist/modules

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
